<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LocaQR - Location QR Generator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f8f9ff);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 650px;
    text-align: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #4f46e5;
    margin-bottom: 35px;
}

.card {
    background: white;
    padding: 45px 30px;
    border-radius: 25px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.10);
}

.pin {
    font-size: 55px;
}

h1 {
    margin: 15px 0 10px;
    font-size: 38px;
    color: #171717;
}

.subtitle {
    color: #666;
    margin-bottom: 30px;
}

.input-box {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

input {
    flex: 1;
    padding: 16px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #6366f1;
}

button {
    border: none;
    cursor: pointer;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
}

.generate {
    width: 100%;
    padding: 16px;
    background: #4f46e5;
    color: white;
}

.generate:hover {
    background: #4338ca;
}

#qrcode {
    margin: 30px auto 20px;
}

.actions {
    display: none;
    gap: 10px;
    justify-content: center;
    margin-top: 15px;
}

.actions button {
    padding: 12px 20px;
    background: #111827;
    color: white;
}

.features {
    display: flex;
    justify-content: space-around;
    margin-top: 30px;
    color: #555;
    font-size: 14px;
}

.footer {
    margin-top: 25px;
    color: #888;
    font-size: 13px;
}

@media (max-width: 500px) {
    h1 {
        font-size: 30px;
    }

    .input-box {
        flex-direction: column;
    }

    .card {
        padding: 35px 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">📍 LocaQR</div>

    <div class="card">

        <div class="pin">📍</div>

        <h1>Location QR Generator</h1>

        <p class="subtitle">
            Turn any location into a QR code in seconds.
        </p>

        <div class="input-box">
            <input
                type="text"
                id="location"
                placeholder="Enter a location..."
            >
        </div>

        <button class="generate" onclick="generateQR()">
            🚀 Generate QR Code
        </button>

        <div id="qrcode"></div>

        <div class="actions" id="actions">
            <button onclick="downloadQR()">⬇️ Download</button>
            <button onclick="openMaps()">🗺️ Maps</button>
        </div>

    </div>

    <div class="features">
        <span>✓ Free</span>
        <span>✓ Fast</span>
        <span>✓ No Sign-up</span>
    </div>

    <div class="footer">
        © 2026 LocaQR
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

let mapURL = "";

function generateQR() {

    const location =
        document.getElementById("location").value.trim();

    if (!location) {
        alert("Please enter a location.");
        return;
    }

    mapURL =
        "https://www.google.com/maps/search/?api=1&query="
        + encodeURIComponent(location);

    document.getElementById("qrcode").innerHTML = "";

    new QRCode(document.getElementById("qrcode"), {
        text: mapURL,
        width: 250,
        height: 250
    });

    document.getElementById("actions").style.display = "flex";
}

function downloadQR() {

    const qr =
        document.querySelector("#qrcode img");

    if (!qr) return;

    const link = document.createElement("a");

    link.href = qr.src;
    link.download = "location-qr.png";

    link.click();
}

function openMaps() {

    if (mapURL) {
        window.open(mapURL, "_blank");
    }
}

</script>

</body>
</html>
